packages:
  - "apps/*"
  - "configs/*"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  "@parcel/watcher": true
  "sharp": true
  "unrs-resolver": true
  "core-js-pure": true
  "esbuild": true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

catalogMode: "strict"
catalog:
  # TypeScript/Linting
  "turbo": "2.11.10"
  "typescript": "7.0.2"
  "@types/node": "26.6.5"
  "@total-typescript/ts-reset": "0.6.1"
  "oxlint": "1.89.0"
  "oxlint-tsgolint": "7.0.2005"
  "oxfmt": "0.74.0"

  # Utils
  "mime": "4.1.1"

  # React.js/Next.js
  "next": "16.4.3"
  "next-intl": "4.14.9"
  "next-themes": "0.4.6"
  "react": "19.3.1"
  "react-dom": "19.3.1"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "react-icons": "5.7.0"

  # Blog
  "@giscus/react": "3.1.0"
  "gray-matter": "4.0.3"
  "katex": "0.18.4"
  "next-mdx-remote": "5.0.0"
  "@mdx-js/mdx": "3.1.1"
  "rehype-katex": "7.0.1"
  "rehype-raw": "7.0.0"
  "rehype-slug": "6.0.0"
  "remark-gfm": "4.0.1"
  "remark-math": "6.0.0"
  "shiki": "1.24.0"
  "@shikijs/rehype": "1.24.0"

  # Markdown Lint
  "markdownlint-cli2": "0.24.0"
  "markdownlint": "0.42.0"
  "markdownlint-rule-relative-links": "5.1.4"

  # Storybook
  "storybook": &storybook "10.6.3"
  "@storybook/addon-docs": *storybook
  "@storybook/addon-a11y": *storybook
  "@storybook/nextjs": *storybook
  "@storybook/addon-themes": *storybook
  "@storybook/test-runner": "0.26.0"
  "@chromatic-com/storybook": "5.3.0"
  "chromatic": "18.13.3"

  # Testing
  "playwright": &playwright "1.64.1"
  "@playwright/test": *playwright
  "start-server-and-test": "3.0.13"

  # CSS
  "postcss": "8.5.31"
  "tailwindcss": &tailwindcss "4.3.3"
  "@tailwindcss/postcss": *tailwindcss
  "@tailwindcss/typography": "0.5.20"
  "tailwind-merge": "3.7.0"
  "@fontsource/montserrat": "5.3.0"
