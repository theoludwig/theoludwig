packages:
  - "apps/*"
  - "configs/*"
  - "packages/*"

allowBuilds:
  "@swc/core": true
  "@parcel/watcher": true
  "sharp": true
  "unrs-resolver": true
  "core-js-pure": true
  "esbuild": true

minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false

catalogMode: "strict"
catalog:
  # TypeScript/Linting
  "turbo": "2.9.16"
  "typescript": "6.0.3"
  "@types/node": "25.9.1"
  "@total-typescript/ts-reset": "0.6.1"
  "oxlint": "1.67.0"
  "oxlint-tsgolint": "0.23.0"
  "oxfmt": "0.52.0"

  # Utils
  "mime": "4.1.0"

  # React.js/Next.js
  "next": "16.2.6"
  "next-intl": "4.13.0"
  "next-themes": "0.4.6"
  "react": "19.2.6"
  "react-dom": "19.2.6"
  "@types/react": "19.2.15"
  "@types/react-dom": "19.2.3"
  "react-icons": "5.6.0"

  # Blog
  "@giscus/react": "3.1.0"
  "gray-matter": "4.0.3"
  "katex": "0.17.0"
  "next-mdx-remote": "5.0.0"
  "@mdx-js/mdx": "3.1.1"
  "rehype-katex": "7.0.1"
  "rehype-raw": "7.0.0"
  "rehype-slug": "6.0.0"
  "remark-gfm": "4.0.1"
  "remark-math": "6.0.0"
  "shiki": "1.24.0"
  "@shikijs/rehype": "1.24.0"

  # Markdown Lint
  "markdownlint-cli2": "0.22.1"
  "markdownlint": "0.40.0"
  "markdownlint-rule-relative-links": "5.1.0"

  # Storybook
  "storybook": &storybook "10.4.1"
  "@storybook/addon-docs": *storybook
  "@storybook/addon-a11y": *storybook
  "@storybook/nextjs": *storybook
  "@storybook/addon-themes": *storybook
  "@storybook/test-runner": "0.24.4"
  "@chromatic-com/storybook": "5.2.1"
  "chromatic": "16.10.0"

  # Testing
  "playwright": &playwright "1.60.0"
  "@playwright/test": *playwright
  "start-server-and-test": "3.0.5"

  # CSS
  "postcss": "8.5.15"
  "tailwindcss": &tailwindcss "4.3.0"
  "@tailwindcss/postcss": *tailwindcss
  "@tailwindcss/typography": "0.5.19"
  "tailwind-merge": "3.6.0"
  "@fontsource/montserrat": "5.2.8"
